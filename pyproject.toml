[build-system]
# here we specify the build-backend. For context:
# - tools like pip and uv are example of build-frontends. Users directly
#   interact with the frontend
# - tools like setuptools, hatchling, scikit-build-core, meson-python are all
#   examples of build backends
requires = [
    # the version bound is recommended in the docs
    "flit_core >=3.11,<4"
]
build-backend = "flit_core.buildapi"

[project]
name = "pah_spec"
license = "MIT"
license-files = ["LICENSE"]
# detect the version number from the __version__ variable in _version.py
dynamic = ["version"]
# we may need to adjust the version bounds
requires-python = ">=3.8"
description = "tool for generating PAH spectra with the single photon approximation"
readme = "README.md"
authors = [{name = "Helena Richie", email = "helenarichie@gmail.com"}]
# we should probably add version bounds
dependencies = [
  'astropy',
  'numpy',
  'pandas',
  'scipy >= 1.6.0',
  'h5py'
]

[project.urls]
Homepage = 'https://github.com/helenarichie/pah_spec'
Documentation = 'https://pah-spec.readthedocs.io/'
Source = 'https://github.com/helenarichie/pah_spec'
Tracker = 'https://github.com/helenarichie/pah_spec/issues'

[dependency-groups]
# these are development dependencies. They can be installed with pip (v25.1+)
# by invoking `pip install --user --group dev` from the directory holding this
# configuration file
docs = [
    'myst_parser',
    'sphinx',
    'sphinx_inline_tabs',
    'sphinx_rtd_theme'
]
dev = [{include-group = "docs"}]
