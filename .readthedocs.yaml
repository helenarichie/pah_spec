version: 2
build:
  os: ubuntu-22.04
  tools:
    python: "3.13"
  jobs:
    install:
      - python -m pip install --upgrade pip
      - pip install --group 'docs' # install doc-dependencies
      - pip install . # install pah_spec - needed (I think) to generate API docs
sphinx:
  configuration: docs/sphinx/conf.py
